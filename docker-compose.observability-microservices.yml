# PDMS Observability — Prometheus + Grafana scraping all three microservices on apps VM <app-host>.
# Copy this repo (or at least grafana/, prometheus.observability-microservices.yml, and this file)
# onto the observability server.
#
# Usage:
#   docker compose -f docker-compose.observability-microservices.yml up -d
#
# Reload Prometheus after editing the config:
#   curl -X POST http://localhost:9090/-/reload
#   (requires --web.enable-lifecycle, enabled below)

services:
  prometheus:
    # digest resolved 2026-08-18 from Docker Hub. This is NOT proof of the digest pulled
    # for the 2026-08-12..14 campaign, which was never recorded; collect_env_facts.sh now
    # captures RepoDigests so future runs do record it. Swap image: for image@<digest>
    # to pin by bytes rather than by tag.
    # prom/prometheus:v3.11.3 -> sha256:cc4b427f44a8000f0eac6b7272db247e89cb78681bbd29dc8e9453349cff0f66
    image: prom/prometheus:v3.11.3
    container_name: pdms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.observability-microservices.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    # digest resolved 2026-08-18 from Docker Hub. This is NOT proof of the digest pulled
    # for the 2026-08-12..14 campaign, which was never recorded; collect_env_facts.sh now
    # captures RepoDigests so future runs do record it. Swap image: for image@<digest>
    # to pin by bytes rather than by tag.
    # grafana/grafana:13.0.1 -> sha256:3625fdfa3cab904abdf9faaff8f40de0639b456ac5c5d322964fe705051d5455
    image: grafana/grafana:13.0.1
    container_name: pdms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  prometheus_data:
