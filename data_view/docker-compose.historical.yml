services:
  influxdb-historical:
    image: influxdb:2.7
    container_name: pdms-historical-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin
      - DOCKER_INFLUXDB_INIT_ORG=pdms
      - DOCKER_INFLUXDB_INIT_BUCKET=pdms_historical
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=pdms-historical-token
    volumes:
      - pdms_historical_influxdb_data:/var/lib/influxdb2

volumes:
  pdms_historical_influxdb_data:
