# PDMS Microservices (sync): person + consent + snapshot — app services only.
# Requires infra (postgres, kafka) from external server.
#
# Usage (3 services on same machine):
#   docker compose -f docker-compose.microservices.yml up -d

services:
  pdms-person:
    build:
      context: ./pdms-microservice-person
      dockerfile: Dockerfile
    image: pdms-microservice-person:latest
    container_name: pdms-person
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-<db-host>}:${POSTGRES_PORT:-5432}/pdms
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pdms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pdms_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST:-<db-host>}:${KAFKA_PORT:-9092}
      SERVICES_SNAPSHOT_URL: http://pdms-snapshot:8081
    volumes:
      - ./pdms-monolith/src/main/resources/jwt-keys:/app/jwt-keys:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.67'
          memory: 1200M

  pdms-snapshot:
    build:
      context: ./pdms-microservice-snapshot
      dockerfile: Dockerfile
    image: pdms-microservice-snapshot:latest
    container_name: pdms-snapshot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-<db-host>}:${POSTGRES_PORT:-5432}/pdms
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pdms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pdms_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST:-<db-host>}:${KAFKA_PORT:-9092}
      SERVICES_PERSON_URL: http://pdms-person:8080
    volumes:
      - ./pdms-monolith/src/main/resources/jwt-keys:/app/jwt-keys:ro
    ports:
      - "8081:8081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2048M
        reservations:
          cpus: '0.33'
          memory: 1200M

  pdms-consent:
    build:
      context: ./pdms-microservice-consent
      dockerfile: Dockerfile
    image: pdms-microservice-consent:latest
    container_name: pdms-consent
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-<db-host>}:${POSTGRES_PORT:-5432}/pdms
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pdms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pdms_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST:-<db-host>}:${KAFKA_PORT:-9092}
      SERVICES_PERSON_URL: http://pdms-person:8080
      SERVICES_SNAPSHOT_URL: http://pdms-snapshot:8081
    volumes:
      - ./pdms-monolith/src/main/resources/jwt-keys:/app/jwt-keys:ro
    ports:
      - "8082:8082"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 2048M
        reservations:
          cpus: '0.20'
          memory: 1200M
