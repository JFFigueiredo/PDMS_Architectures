spring.application.name=PDMS-Hybrid-Decentralized

# ---------------------------------------------------------------
# Hybrid model:
# - PostgreSQL remains the source of truth for domain data.
# - Consent anchors are recorded asynchronously via outbox processing.
#   (blockchain-like tamper-evident chain in consent_ledger_anchor)
# ---------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pdms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=67
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PDMS-Hybrid-Decentralized-HikariPool
# Identify connections in PostgreSQL sessions view
spring.datasource.hikari.connectionInitSql=SET application_name='pdms-hybrid-decentralized'

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.lock-retry-count=10

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration (same topics as all other variants)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=pdms-hybrid-decentralized-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Logging
logging.level.ipl.pdms=INFO
logging.level.ipl.pdms.outbox=INFO
logging.level.org.springframework.kafka=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=10s

# Application Info
info.app.name=PDMS-Hybrid-Decentralized
info.app.description=PDMS Hybrid (PostgreSQL master + blockchain-like consent anchors)
info.app.version=@project.version@

# JWT
jwt.public-key.path=classpath:jwt-keys/public-key.pem

# Outbox
outbox.batch-size=1000
outbox.processing-timeout-minutes=5

# Optional: Hyperledger Besu (docker-compose.decentralized enables this against service `besu`)
pdms.blockchain.enabled=false
pdms.blockchain.rpc-url=http://localhost:8545
pdms.blockchain.private-key=
pdms.blockchain.chain-id=1337
pdms.blockchain.gas-limit=8000000
pdms.blockchain.scheduled-fixed-delay-ms=500

# HTTP metrics histograms (p50/p95/p99 — same as all variants for benchmark parity)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1000ms,5000ms
management.metrics.web.server.request.autotime.enabled=true
management.observations.key-values.http.server.request.path=/
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
spring.data.repository.observability.enabled=true
