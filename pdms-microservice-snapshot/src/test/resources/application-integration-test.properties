# Integration Test Configuration
# This file overrides application.properties for integration tests

# Disable JPA validation - we use Flyway for schema management
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway will create all tables
spring.flyway.enabled=true

# Avoid background schedulers mutating state during integration tests.
spring.task.scheduling.enabled=false

# Only normalized schema is supported

# HikariCP Connection Pool Configuration for Tests
# Increased pool size for parallel test execution
# Extended timeouts to handle Testcontainers startup delays
# Shorter maxLifetime to handle container recycling between tests
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=PDMS-Test-HikariPool
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JWT Configuration for Tests
# The test configuration provides a test public key resource
# that matches TestJwtTokenGenerator's in-memory key pair
# No external service needed - tokens are generated and validated in-memory
jwt.public-key.path=classpath:jwt-key/public-key.pem


