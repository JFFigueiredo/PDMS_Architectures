spring.application.name=pdms-person-service
server.port=8080

# Microservice URLs
services.snapshot.url=http://localhost:8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pdms
spring.datasource.username=pdms_user
spring.datasource.password=pdms_password
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=90
spring.datasource.hikari.minimum-idle=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PDMS-HikariPool

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=pdms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Logging Configuration
logging.level.ipl.pdms=INFO
logging.level.ipl.pdms.shared.outbox=INFO
logging.level.org.springframework.kafka=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=10s

# Application Info
info.app.name=PDMS
info.app.description=Personal Data Management System
info.app.version=@project.version@


# JWT Configuration
# Path to the RSA public key file (PEM format) for token validation
# This should match the public key generated by the JWT token service
# The validator will try multiple locations: working dir, module jwt-keys/, etc.
# Use a plain relative path - the validator will try multiple locations automatically
jwt.public-key.path=classpath:jwt-keys/public-key.pem

# Outbox Configuration
# Number of events to process per batch
outbox.batch-size=1000
# Minutes before resetting stuck PROCESSING events
outbox.processing-timeout-minutes=5

# HTTP Response Time Histograms (enables p50/p95/p99 in Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1000ms,5000ms

# HTTP Server Metrics - Include URI tag
management.metrics.web.server.request.autotime.enabled=true
management.observations.key-values.http.server.request.path=/
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Spring Data Repository Observability (enables DB query time metrics)
spring.data.repository.observability.enabled=true